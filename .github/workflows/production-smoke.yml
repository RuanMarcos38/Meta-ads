name: API Production Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gestao-ads-api-production-verification
  cancel-in-progress: true

jobs:
  verify-api:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check API and database
        env:
          API_URL: https://api-gestao.r2rmarketingdigital.com.br
        run: |
          set -euo pipefail
          body="$(curl -fsSL --connect-timeout 10 --max-time 20 "${API_URL}/health")"
          echo "$body" | jq .
          printf '%s' "$body" | jq -e '.success == true and .data.status == "ok" and .data.database == "connected" and .data.schema == "gestao_ads"' >/dev/null
          echo "API e banco conectados no schema gestao_ads."

      - name: Check authentication readiness
        env:
          API_URL: https://api-gestao.r2rmarketingdigital.com.br
        run: |
          set -euo pipefail
          body="$(curl -fsSL --connect-timeout 10 --max-time 20 "${API_URL}/auth/status")"
          echo "$body" | jq .
          printf '%s' "$body" | jq -e '.success == true and .data.ready == true and .data.activeUsers > 0 and .data.schema == "gestao_ads"' >/dev/null
          echo "Autenticação inicializada com usuário ativo."

      - name: Check invalid login handling
        env:
          API_URL: https://api-gestao.r2rmarketingdigital.com.br
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl -sS --connect-timeout 10 --max-time 20 -o "$response_file" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"email":"diagnostico-invalido@r2rmarketingdigital.com.br","password":"senha-invalida"}' \
            "${API_URL}/auth/login")"
          cat "$response_file" | jq .
          test "$status" = "401"
          cat "$response_file" | jq -e '.success == false and .error.code == "INVALID_CREDENTIALS"' >/dev/null
          echo "Login inválido tratado corretamente sem erro interno."

      - name: Check frontend CORS access
        env:
          API_URL: https://api-gestao.r2rmarketingdigital.com.br
          FRONTEND_ORIGIN: https://gestao.r2rmarketingdigital.com.br
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl -fsSL --connect-timeout 10 --max-time 20 -D "$headers" -o /dev/null -H "Origin: ${FRONTEND_ORIGIN}" "${API_URL}/health"
          tr -d '\r' < "$headers" | grep -iF "access-control-allow-origin: ${FRONTEND_ORIGIN}"
          echo "CORS permite o domínio oficial do frontend."
