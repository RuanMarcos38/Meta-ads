name: Production Smoke Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gestao-ads-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect latest deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=5")"
          echo "$response" | jq -r '.workflow_runs[] | "deploy run=\(.id) status=\(.status) conclusion=\(.conclusion) sha=\(.head_sha) created=\(.created_at) url=\(.html_url)"'
          latest_id="$(echo "$response" | jq -r '.workflow_runs[0].id // empty')"
          latest_status="$(echo "$response" | jq -r '.workflow_runs[0].status // empty')"
          latest_conclusion="$(echo "$response" | jq -r '.workflow_runs[0].conclusion // empty')"
          test -n "$latest_id"
          jobs="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs/${latest_id}/jobs?per_page=100")"
          echo "$jobs" | jq -r '.jobs[] | "job=\(.name) status=\(.status) conclusion=\(.conclusion)", (.steps[] | "  step=\(.name) status=\(.status) conclusion=\(.conclusion)")'
          if [ "$latest_status" != "completed" ] || [ "$latest_conclusion" != "success" ]; then
            echo "O deploy mais recente ainda não concluiu com sucesso."
            exit 1
          fi

      - name: Check frontend release
        env:
          EXPECTED_VERSION: 2026.08.01.1
          FRONTEND_URL: https://gestao.r2rmarketingdigital.com.br
        run: |
          set -euo pipefail
          body="$(curl -fsSL --connect-timeout 10 --max-time 20 "${FRONTEND_URL}/deploy-version.txt?verification=${GITHUB_SHA}")"
          printf '%s' "$body" | grep -Fq "$EXPECTED_VERSION"
          echo "Frontend publicado na versão ${EXPECTED_VERSION}."

      - name: Check API and database
        env:
          API_URL: https://api-gestao.r2rmarketingdigital.com.br
        run: |
          set -euo pipefail
          body="$(curl -fsSL --connect-timeout 10 --max-time 20 "${API_URL}/health")"
          printf '%s' "$body" | jq -e '.success == true and .data.status == "ok" and .data.database == "connected" and .data.schema == "gestao_ads"' >/dev/null
          echo "API e banco conectados no schema gestao_ads."

      - name: Check authentication readiness
        env:
          API_URL: https://api-gestao.r2rmarketingdigital.com.br
        run: |
          set -euo pipefail
          body="$(curl -fsSL --connect-timeout 10 --max-time 20 "${API_URL}/auth/status")"
          printf '%s' "$body" | jq -e '.success == true and .data.ready == true and .data.activeUsers > 0 and .data.schema == "gestao_ads"' >/dev/null
          echo "Autenticação inicializada com usuário ativo."

      - name: Check frontend CORS access
        env:
          API_URL: https://api-gestao.r2rmarketingdigital.com.br
          FRONTEND_ORIGIN: https://gestao.r2rmarketingdigital.com.br
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl -fsSL --connect-timeout 10 --max-time 20 -D "$headers" -o /dev/null -H "Origin: ${FRONTEND_ORIGIN}" "${API_URL}/health"
          tr -d '\r' < "$headers" | grep -iF "access-control-allow-origin: ${FRONTEND_ORIGIN}"
          echo "CORS permite o domínio oficial do frontend."
