name: Production Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gestao-ads-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect latest deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=5")"
          echo "$response" | jq -r '.workflow_runs[] | "deploy run=\(.id) status=\(.status) conclusion=\(.conclusion) sha=\(.head_sha) created=\(.created_at) url=\(.html_url)"'

      - name: Check Meta assignment CORS preflight
        env:
          API_URL: https://api-gestao.r2rmarketingdigital.com.br
          FRONTEND_ORIGIN: https://gestao.r2rmarketingdigital.com.br
          TEST_ACCOUNT_UUID: e5d248a9-5dc1-486f-b1c8-0158c0f4a1d5
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          status="$(curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -D "$headers" -w '%{http_code}' \
            -X OPTIONS \
            -H "Origin: ${FRONTEND_ORIGIN}" \
            -H "Access-Control-Request-Method: PATCH" \
            -H "Access-Control-Request-Headers: authorization,content-type" \
            "${API_URL}/meta/client-accounts/${TEST_ACCOUNT_UUID}/assignment")"
          echo "Preflight HTTP ${status}"
          tr -d '\r' < "$headers" | grep -i '^access-control-' || true
          origin="$(tr -d '\r' < "$headers" | awk -F': ' 'tolower($1)=="access-control-allow-origin" {print $2}' | tail -1)"
          methods="$(tr -d '\r' < "$headers" | awk -F': ' 'tolower($1)=="access-control-allow-methods" {print $2}' | tail -1)"
          test "$origin" = "$FRONTEND_ORIGIN"
          printf '%s' "$methods" | grep -q 'PATCH'
          printf '%s' "$methods" | grep -q 'POST'
          echo "Preflight da autorização Meta aceita PATCH e POST."

      - name: Check Meta account authorization backend
        env:
          API_URL: https://api-gestao.r2rmarketingdigital.com.br
          EXPECTED_RELEASE: 2026.08.31.4
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 "${API_URL}/meta/account-assignment-capability?attempt=${attempt}" 2>/dev/null || true)"
            if printf '%s' "$body" | jq -e --arg release "$EXPECTED_RELEASE" '.success == true and .data.enabled == true and .data.version == $release and .data.liveBillingAndDeliveryStatus == true and .data.collaborativeInternalSupport == true' >/dev/null 2>&1; then
              echo "Backend publicado na versão ${EXPECTED_RELEASE}, com cobrança/status Meta e Atendimento colaborativo habilitados."
              exit 0
            fi
            current_release="$(printf '%s' "$body" | jq -r '.data.version // empty' 2>/dev/null || true)"
            echo "Tentativa ${attempt}/30: release atual=${current_release:-indisponível}; aguardando backend colaborativo."
            sleep 10
          done
          echo "O backend colaborativo da release ${EXPECTED_RELEASE} ainda não está publicado no EasyPanel."
          exit 1

      - name: Check API and database
        env:
          API_URL: https://api-gestao.r2rmarketingdigital.com.br
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 "${API_URL}/health?attempt=${attempt}" 2>/dev/null || true)"
            if printf '%s' "$body" | jq -e '.success == true and .data.status == "ok" and .data.database == "connected" and .data.schema == "gestao_ads"' >/dev/null 2>&1; then
              echo "API e banco conectados no schema gestao_ads."
              exit 0
            fi
            echo "Tentativa ${attempt}/30: API ou banco ainda indisponível."
            sleep 10
          done
          echo "A API não confirmou conexão saudável com o banco."
          exit 1

      - name: Check authentication readiness
        env:
          API_URL: https://api-gestao.r2rmarketingdigital.com.br
        run: |
          set -euo pipefail
          body="$(curl -fsSL --connect-timeout 10 --max-time 20 "${API_URL}/auth/status")"
          printf '%s' "$body" | jq -e '.success == true and .data.ready == true and .data.activeUsers > 0 and .data.schema == "gestao_ads"' >/dev/null
          echo "Autenticação inicializada com usuário ativo."

      - name: Check Evolution WhatsApp connection
        env:
          API_URL: https://api-gestao.r2rmarketingdigital.com.br
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 "${API_URL}/diagnostics/whatsapp?attempt=${attempt}" 2>/dev/null || true)"
            if printf '%s' "$body" | jq -e '.success == true and .data.configured == true and .data.reachable == true and .data.connected == true and .data.category == "CONNECTED"' >/dev/null 2>&1; then
              state="$(printf '%s' "$body" | jq -r '.data.state // "unknown"')"
              host="$(printf '%s' "$body" | jq -r '.data.host // "unknown"')"
              echo "Evolution API configurada, acessível e conectada. host=${host} state=${state}"
              exit 0
            fi
            category="$(printf '%s' "$body" | jq -r '.data.category // "indisponível"' 2>/dev/null || true)"
            state="$(printf '%s' "$body" | jq -r '.data.state // "indisponível"' 2>/dev/null || true)"
            echo "Tentativa ${attempt}/30: WhatsApp ainda não confirmou conexão. category=${category:-indisponível} state=${state:-indisponível}"
            sleep 10
          done
          echo "A Evolution API não confirmou conexão ativa em produção."
          exit 1

      - name: Check frontend CORS access
        env:
          API_URL: https://api-gestao.r2rmarketingdigital.com.br
          FRONTEND_ORIGIN: https://gestao.r2rmarketingdigital.com.br
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl -fsSL --connect-timeout 10 --max-time 20 -D "$headers" -o /dev/null -H "Origin: ${FRONTEND_ORIGIN}" "${API_URL}/health"
          tr -d '\r' < "$headers" | grep -iF "access-control-allow-origin: ${FRONTEND_ORIGIN}"
          echo "CORS permite o domínio oficial do frontend."

      - name: Check public frontend availability
        env:
          FRONTEND_URL: https://gestao.r2rmarketingdigital.com.br
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            root_status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/frontend-root.html -w '%{http_code}' "${FRONTEND_URL}/?deploy_attempt=${attempt}" || true)"
            index_status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/frontend-index.html -w '%{http_code}' "${FRONTEND_URL}/index.html?deploy_attempt=${attempt}" || true)"
            version_status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/frontend-version.txt -w '%{http_code}' "${FRONTEND_URL}/deploy-version.txt?deploy_attempt=${attempt}" || true)"
            version="$(cat /tmp/frontend-version.txt 2>/dev/null || true)"
            echo "Tentativa ${attempt}/20: root=${root_status} index=${index_status} deploy-version=${version_status} versão=${version}"
            if [ "$root_status" = "200" ] && [ "$index_status" = "200" ] && grep -qi '<html' /tmp/frontend-root.html && grep -qi '<html' /tmp/frontend-index.html; then
              echo "Frontend público disponível na Hostinger."
              exit 0
            fi
            sleep 15
          done
          echo "Frontend continua indisponível após aguardar a publicação da Hostinger."
          echo "Resposta raiz:"
          head -c 300 /tmp/frontend-root.html || true
          echo
          echo "Resposta index.html:"
          head -c 300 /tmp/frontend-index.html || true
          echo
          exit 1
