name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=gestao_ads
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=gestao_ads
      DATABASE_SCHEMA: gestao_ads
      JWT_SECRET: ci-jwt-secret-with-more-than-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-more-than-32-characters
      ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      DEMO_MODE: "true"
      RUN_INTEGRATION_TESTS: "true"
      SEED_ADMIN_NAME: Administrador CI
      SEED_ADMIN_EMAIL: admin@r2rmarketingdigital.com.br
      SEED_ADMIN_PASSWORD: "CiAdmin#2026!Secure"
      SEED_DEMO_CLIENT: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install API dependencies
        working-directory: apps/api
        run: npm install

      - name: Audit API production dependencies
        working-directory: apps/api
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Prepare isolated integration database
        working-directory: apps/api
        run: |
          npx prisma db push --skip-generate
          npm run seed

      - name: Typecheck API
        working-directory: apps/api
        run: npm run typecheck

      - name: Test API unit and integration flows
        working-directory: apps/api
        run: npm test

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm install

      - name: Audit Web production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck Web
        working-directory: apps/web
        run: npm run typecheck

      - name: Build Web
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: https://api-gestao.r2rmarketingdigital.com.br
        run: npm run build

  production-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Probe published frontend and API
        shell: bash
        run: |
          set -u
          failed=0

          probe() {
            local label="$1"
            local url="$2"
            local expected="$3"
            local body_file
            body_file="$(mktemp)"
            local status
            status="$(curl -sS --connect-timeout 10 --max-time 20 -o "$body_file" -w '%{http_code}' "$url" || true)"
            echo "[$label] HTTP ${status} ${url}"
            head -c 500 "$body_file" || true
            echo
            if [[ ! "$status" =~ $expected ]]; then
              failed=1
            fi
          }

          probe "frontend-login" "https://gestao.r2rmarketingdigital.com.br/login" '^2[0-9][0-9]$'
          probe "api-live" "https://api-gestao.r2rmarketingdigital.com.br/live" '^2[0-9][0-9]$'
          probe "database-diagnostics" "https://api-gestao.r2rmarketingdigital.com.br/diagnostics/database" '^2[0-9][0-9]$'
          probe "api-health" "https://api-gestao.r2rmarketingdigital.com.br/health" '^2[0-9][0-9]$'
          probe "auth-status" "https://api-gestao.r2rmarketingdigital.com.br/auth/status" '^2[0-9][0-9]$'

          if [ "$failed" -ne 0 ]; then
            echo "Uma ou mais verificações públicas falharam. Consulte os status acima."
            exit 1
          fi
