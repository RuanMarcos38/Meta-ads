name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gestao-ads-production
  cancel-in-progress: true

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    env:
      HOSTINGER_SFTP_HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
      HOSTINGER_SFTP_USER: ${{ secrets.HOSTINGER_SFTP_USER }}
      HOSTINGER_SFTP_PASSWORD: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
      HOSTINGER_SFTP_PATH: ${{ secrets.HOSTINGER_SFTP_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          missing=0
          for name in HOSTINGER_SFTP_HOST HOSTINGER_SFTP_USER HOSTINGER_SFTP_PASSWORD HOSTINGER_SFTP_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "Secret ausente: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure os quatro secrets de SFTP antes de publicar."
            exit 1
          fi

      - name: Build frontend
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: https://api-gestao.r2rmarketingdigital.com.br
        run: |
          npm install
          npm run typecheck
          npm run build
          echo "2026.08.01.1" > dist/deploy-version.txt
          grep -R "2026.08.01.1" dist/assets >/dev/null

      - name: Deploy frontend via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USER }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          local_path: 'apps/web/dist/*'
          remote_path: ${{ secrets.HOSTINGER_SFTP_PATH }}
          sftp_only: true

      - name: Deploy SPA rewrite file
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USER }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          local_path: 'apps/web/dist/.htaccess'
          remote_path: ${{ secrets.HOSTINGER_SFTP_PATH }}
          sftp_only: true

      - name: Verify published frontend
        env:
          EXPECTED_VERSION: 2026.08.01.1
          FRONTEND_URL: https://gestao.r2rmarketingdigital.com.br
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 "${FRONTEND_URL}/deploy-version.txt?sha=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -Fq "$EXPECTED_VERSION"; then
              echo "Frontend publicado e validado na versão ${EXPECTED_VERSION}."
              exit 0
            fi
            echo "Tentativa ${attempt}/12: aguardando publicação."
            sleep 10
          done
          echo "O upload terminou, mas a versão publicada não foi confirmada."
          exit 1
