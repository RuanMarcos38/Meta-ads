name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gestao-ads-production
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    env:
      # O EasyPanel já usa GitHub/main como fonte. Quando o Auto Deploy nativo
      # está habilitado no serviço, o webhook do próprio EasyPanel inicia o deploy
      # a cada push. Os URLs abaixo permanecem apenas como fallback opcional.
      EASYPANEL_DEPLOY_TRIGGER_URL: ${{ secrets.EASYPANEL_DEPLOY_TRIGGER_URL }}
      EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
      EASYPANEL_WEBHOOK_URL: ${{ secrets.EASYPANEL_WEBHOOK_URL }}
      API_URL: https://api-gestao.r2rmarketingdigital.com.br
      FRONTEND_ORIGIN: https://gestao.r2rmarketingdigital.com.br
      EXPECTED_RELEASE: 2026.08.31.2
      TEST_ACCOUNT_UUID: e5d248a9-5dc1-486f-b1c8-0158c0f4a1d5
    steps:
      - name: Resolve optional EasyPanel deployment trigger
        run: |
          set -euo pipefail
          trigger="${EASYPANEL_DEPLOY_TRIGGER_URL:-}"
          [ -n "$trigger" ] || trigger="${EASYPANEL_DEPLOY_URL:-}"
          [ -n "$trigger" ] || trigger="${EASYPANEL_WEBHOOK_URL:-}"
          if [ -z "$trigger" ]; then
            echo "EASYPANEL_TRIGGER_READY=false" >> "$GITHUB_ENV"
            echo "Sem trigger externo: aguardando o Auto Deploy nativo GitHub -> EasyPanel."
          else
            echo "EASYPANEL_TRIGGER_READY=true" >> "$GITHUB_ENV"
            echo "EASYPANEL_TRIGGER_URL=$trigger" >> "$GITHUB_ENV"
            echo "Deployment Trigger URL encontrado e será usado como fallback explícito."
          fi

      - name: Trigger EasyPanel backend deployment when configured
        if: env.EASYPANEL_TRIGGER_READY == 'true'
        run: |
          set -euo pipefail
          status="$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/easypanel-response -w '%{http_code}' -X POST "$EASYPANEL_TRIGGER_URL" || true)"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            status="$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/easypanel-response -w '%{http_code}' "$EASYPANEL_TRIGGER_URL" || true)"
          fi
          echo "EasyPanel deployment trigger HTTP ${status}."
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "O Deployment Trigger URL do EasyPanel não aceitou a solicitação."
            exit 1
          fi

      - name: Verify EasyPanel native auto deployment
        run: |
          set -euo pipefail
          echo "Aguardando o EasyPanel publicar a release ${EXPECTED_RELEASE} da branch main."
          for attempt in $(seq 1 60); do
            capability="$(curl -fsSL --connect-timeout 10 --max-time 20 "${API_URL}/meta/account-assignment-capability?attempt=${attempt}&sha=${GITHUB_SHA}" 2>/dev/null || true)"
            headers="$(mktemp)"
            curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -D "$headers" -X OPTIONS \
              -H "Origin: ${FRONTEND_ORIGIN}" \
              -H "Access-Control-Request-Method: PATCH" \
              -H "Access-Control-Request-Headers: authorization,content-type" \
              "${API_URL}/meta/client-accounts/${TEST_ACCOUNT_UUID}/assignment" || true
            methods="$(tr -d '\r' < "$headers" | awk -F': ' 'tolower($1)=="access-control-allow-methods" {print $2}' | tail -1)"
            current_release="$(printf '%s' "$capability" | jq -r '.data.version // empty' 2>/dev/null || true)"
            if printf '%s' "$capability" | jq -e --arg release "$EXPECTED_RELEASE" '.success == true and .data.enabled == true and .data.version == $release' >/dev/null 2>&1 \
              && printf '%s' "$methods" | grep -q 'PATCH' \
              && printf '%s' "$methods" | grep -q 'POST'; then
              echo "EasyPanel atualizado automaticamente e validado na release ${EXPECTED_RELEASE}. Métodos: ${methods}."
              exit 0
            fi
            echo "Tentativa ${attempt}/60: release atual=${current_release:-indisponível}; aguardando Auto Deploy do EasyPanel."
            sleep 10
          done
          echo "O push chegou à main, porém o EasyPanel não publicou a release ${EXPECTED_RELEASE} em até 10 minutos."
          echo "No serviço gestao2r, abra Visão Geral e confirme que 'Enable Auto Deploy' está ativado para a fonte GitHub."
          exit 1

  deploy-frontend:
    runs-on: ubuntu-latest
    env:
      HOSTINGER_SFTP_HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
      HOSTINGER_SFTP_USER: ${{ secrets.HOSTINGER_SFTP_USER }}
      HOSTINGER_SFTP_PASSWORD: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
      HOSTINGER_SFTP_PATH: ${{ secrets.HOSTINGER_SFTP_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect deployment configuration
        run: |
          set -euo pipefail
          ready=true
          for name in HOSTINGER_SFTP_HOST HOSTINGER_SFTP_USER HOSTINGER_SFTP_PASSWORD HOSTINGER_SFTP_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "Secret ausente: ${name}"
              ready=false
            fi
          done
          echo "HOSTINGER_DEPLOY_READY=${ready}" >> "$GITHUB_ENV"
          if [ "$ready" != "true" ]; then
            echo "SFTP ainda não configurado. O build será gerado e salvo como artifact para não bloquear a entrega."
          fi

      - name: Build frontend
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: https://api-gestao.r2rmarketingdigital.com.br
        run: |
          set -euo pipefail
          npm install
          npm run typecheck
          npm run build
          printf '%s\n' "${GITHUB_SHA}" > dist/deploy-version.txt
          test -s dist/index.html
          test -s dist/deploy-version.txt
          test -s dist/.htaccess

      - name: Package frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestao-ads-frontend-${{ github.sha }}
          path: apps/web/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Deploy frontend via SFTP
        if: env.HOSTINGER_DEPLOY_READY == 'true'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USER }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          local_path: 'apps/web/dist/*'
          remote_path: ${{ secrets.HOSTINGER_SFTP_PATH }}
          sftp_only: true

      - name: Deploy SPA rewrite file
        if: env.HOSTINGER_DEPLOY_READY == 'true'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USER }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          local_path: 'apps/web/dist/.htaccess'
          remote_path: ${{ secrets.HOSTINGER_SFTP_PATH }}
          sftp_only: true

      - name: Verify published frontend
        if: env.HOSTINGER_DEPLOY_READY == 'true'
        env:
          EXPECTED_VERSION: ${{ github.sha }}
          FRONTEND_URL: https://gestao.r2rmarketingdigital.com.br
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 "${FRONTEND_URL}/deploy-version.txt?sha=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            if [ "$body" = "$EXPECTED_VERSION" ]; then
              echo "Frontend publicado e validado no commit ${EXPECTED_VERSION}."
              exit 0
            fi
            echo "Tentativa ${attempt}/12: aguardando publicação do commit atual."
            sleep 10
          done
          echo "O upload terminou, mas o commit publicado não foi confirmado."
          exit 1

      - name: Deployment summary
        run: |
          if [ "${HOSTINGER_DEPLOY_READY}" = "true" ]; then
            echo "Frontend enviado para a Hostinger e verificado pelo SHA do commit."
          else
            echo "Frontend compilado com sucesso e salvo como artifact. Publicação SFTP aguardando os secrets da Hostinger."
          fi
