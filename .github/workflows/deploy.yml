name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gestao-ads-production
  cancel-in-progress: true

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: https://api-gestao.r2rmarketingdigital.com.br
        run: |
          npm install
          npm run typecheck
          npm run build
          echo "2026.08.01.1" > dist/deploy-version.txt
          grep -R "2026.08.01.1" dist/assets >/dev/null

      - name: Deploy frontend via SFTP
        if: ${{ secrets.HOSTINGER_SFTP_HOST != '' && secrets.HOSTINGER_SFTP_USER != '' && secrets.HOSTINGER_SFTP_PASSWORD != '' && secrets.HOSTINGER_SFTP_PATH != '' }}
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USER }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          local_path: 'apps/web/dist/*'
          remote_path: ${{ secrets.HOSTINGER_SFTP_PATH }}
          sftp_only: true

      - name: Deploy SPA rewrite file
        if: ${{ secrets.HOSTINGER_SFTP_HOST != '' && secrets.HOSTINGER_SFTP_USER != '' && secrets.HOSTINGER_SFTP_PASSWORD != '' && secrets.HOSTINGER_SFTP_PATH != '' }}
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USER }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          local_path: 'apps/web/dist/.htaccess'
          remote_path: ${{ secrets.HOSTINGER_SFTP_PATH }}
          sftp_only: true

      - name: Deployment configuration missing
        if: ${{ secrets.HOSTINGER_SFTP_HOST == '' || secrets.HOSTINGER_SFTP_USER == '' || secrets.HOSTINGER_SFTP_PASSWORD == '' || secrets.HOSTINGER_SFTP_PATH == '' }}
        run: |
          echo "Deploy não executado: configure os quatro secrets HOSTINGER_SFTP_HOST, HOSTINGER_SFTP_USER, HOSTINGER_SFTP_PASSWORD e HOSTINGER_SFTP_PATH."
          exit 1
